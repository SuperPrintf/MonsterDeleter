[package]
name = "monster-deleter"
version = "1.0.17"
edition = "2021"
description = "A consent-first Windows Recycle Bin helper with a playful monster theme."
license = "MIT"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
regex = "1.12"
serde_json = "1.0"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Multimedia",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Environment",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
winres = "0.1"
